name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every minor version the README's "Python 3.10+" badge covers today.
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m ruleguard run examples/suite.json --replay examples/synthetic-before.json --json demo.json --junit demo.xml
      - run: python -m ruleguard lint examples/local_rules.xml examples/php2shell_indicators.xml --strict

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Exact versions, so a new scanner release cannot change what runs here without a review.
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - run: bandit -r ruleguard -q
      - run: pip-audit --progress-spinner off .
