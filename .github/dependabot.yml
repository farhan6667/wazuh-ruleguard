version: 2
updates:
  # Keeps the SHA-pinned actions current, one reviewed pull request at a time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # RuleGuard has no runtime dependencies; this watches the build backend bound in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
