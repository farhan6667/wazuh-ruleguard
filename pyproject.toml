[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-ruleguard"
version = "0.1.0"
description = "Declarative Wazuh 4.x detection regression tests and upgrade diffs"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Syed Farhan Ahmed"}]
dependencies = []
readme = "README.md"

[project.scripts]
ruleguard = "ruleguard.cli:main"

[tool.setuptools.packages.find]
include = ["ruleguard*"]
