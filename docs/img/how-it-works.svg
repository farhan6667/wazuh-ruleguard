<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 404" width="1280" height="404" role="img" aria-label="How Wazuh RuleGuard works in four steps"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a16"/><stop offset="1" stop-color="#0d1a36"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d1ff"/><stop offset="1" stop-color="#4f7dff"/></linearGradient>
<linearGradient id="acx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d1ff"/><stop offset="1" stop-color="#4f7dff"/></linearGradient>
<radialGradient id="gl1" cx="0.78" cy="0.35" r="0.55"><stop offset="0" stop-color="#00d1ff" stop-opacity="0.28"/><stop offset="1" stop-color="#00d1ff" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#4f7dff" stop-opacity="0.18"/><stop offset="1" stop-color="#4f7dff" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
<path d="M28 0 L56 16 V48 L28 64 L0 48 V16 Z M28 64 V97 M0 48 L-28 64 M56 48 L84 64" fill="none" stroke="#00d1ff" stroke-opacity="0.09" stroke-width="1.2"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="wclip"><rect width="1280" height="404"/></clipPath>
</defs><g clip-path="url(#wclip)"><rect width="1280" height="404" fill="url(#bg)"/><rect width="1280" height="404" fill="url(#hex)"/><rect width="1280" height="404" fill="url(#gl1)"/><rect width="1280" height="404" fill="url(#gl2)"/><g transform="translate(1180 6) scale(0.4)">
<path d="M50 4 L92 20 V58 C92 88 72 108 50 116 C28 108 8 88 8 58 V20 Z" fill="none" fill-opacity="0.1" stroke="url(#ac)" stroke-width="4" stroke-linejoin="round"/>
<polyline points="20,64 38,64 46,42 57,88 65,64 82,64" fill="none" stroke="#4f7dff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#00d1ff" letter-spacing="3.2">HOW IT WORKS</text><rect x="40" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#00d1ff" stroke-opacity="0.5"/><rect x="40" y="76" width="266" height="192" rx="18" fill="#00d1ff" fill-opacity="0.08"/><circle cx="76" cy="114" r="20" fill="#00d1ff" fill-opacity="0.16" stroke="#00d1ff" stroke-opacity="0.7"/><text x="76" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><g transform="translate(254 98)" fill="none" stroke="#00d1ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h14l8 8v20H4z"/><path d="M18 2v8h8M9 17h12M9 23h12"/></g><text x="62" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Your test corpus</text><text x="62" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Sample logs in a JSON suite,</text><text x="62" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >each with the rule, level</text><text x="62" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >and decoder you expect</text><path d="M314 172 H338" stroke="#00d1ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M332 165 L343 172 L332 179" fill="none" stroke="#00d1ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#00d1ff" stroke-opacity="0.5"/><rect x="352" y="76" width="266" height="192" rx="18" fill="#00d1ff" fill-opacity="0.08"/><circle cx="388" cy="114" r="20" fill="#00d1ff" fill-opacity="0.16" stroke="#00d1ff" stroke-opacity="0.7"/><text x="388" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><g transform="translate(566 98)" fill="none" stroke="#00d1ff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="4" width="24" height="9" rx="2"/><rect x="3" y="17" width="24" height="9" rx="2"/><path d="M8 8.5h.01M8 21.5h.01M13 8.5h8M13 21.5h8"/></g><text x="374" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Wazuh 4.x logtest</text><text x="374" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >A disposable test manager</text><text x="374" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >over HTTPS, or an offline</text><text x="374" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >replay of saved results</text><path d="M626 172 H650" stroke="#00d1ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M644 165 L655 172 L644 179" fill="none" stroke="#00d1ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="664" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#00d1ff" stroke-opacity="0.5"/><rect x="664" y="76" width="266" height="192" rx="18" fill="#00d1ff" fill-opacity="0.08"/><circle cx="700" cy="114" r="20" fill="#00d1ff" fill-opacity="0.16" stroke="#00d1ff" stroke-opacity="0.7"/><text x="700" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><g transform="translate(878 98)" fill="none" stroke="#00d1ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="12"/><path d="M9 15.5l4.2 4.2L21.5 11"/></g><text x="686" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Checks</text><text x="686" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Expected and forbidden rules,</text><text x="686" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >sequences, no-alert cases.</text><text x="686" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Backend warnings fail too</text><path d="M938 172 H962" stroke="#00d1ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M956 165 L967 172 L956 179" fill="none" stroke="#00d1ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="976" y="76" width="266" height="192" rx="18" fill="#0b1630" stroke="#4f7dff" stroke-opacity="0.5"/><rect x="976" y="76" width="266" height="192" rx="18" fill="#4f7dff" fill-opacity="0.12"/><circle cx="1012" cy="114" r="20" fill="#4f7dff" fill-opacity="0.16" stroke="#4f7dff" stroke-opacity="0.7"/><text x="1012" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><g transform="translate(1190 98)" fill="none" stroke="#4f7dff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="24" height="24" rx="3"/><path d="M8 20v-5M14 20V9M20 20v-8"/></g><text x="998" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" >Reports</text><text x="998" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >JSON, JUnit XML and an offline</text><text x="998" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >HTML page. Exit code 1 when</text><text x="998" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >something fails</text><rect x="40" y="302" width="1200" height="74" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#00d1ff" stroke-opacity="0.3"/><text x="66" y="334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="700" fill="#ffffff" >Upgrading Wazuh or editing a rule?</text><text x="66" y="359" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#b4c3e6" >Save baseline.json first, run the same suite on the candidate, then compare the two.</text><rect x="900" y="320" width="150" height="38" rx="10" fill="#ffffff" fill-opacity="0.08"/><text x="975" y="345" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="15.5" font-weight="600" fill="#e6eeff" text-anchor="middle">baseline.json</text><path d="M1056 339 H1082" stroke="#00d1ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M1076 332 L1087 339 L1076 346" fill="none" stroke="#00d1ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1094" y="320" width="132" height="38" rx="10" fill="#ff5d73" fill-opacity="0.2"/><text x="1160" y="345" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="15.5" font-weight="600" fill="#ffb3c1" text-anchor="middle">changes.html</text></g></svg>