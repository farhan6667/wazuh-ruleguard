<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="1280" height="350" role="img" aria-label="How Wazuh RuleGuard works">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1b"/><stop offset="1" stop-color="#101c38"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d1ff"/><stop offset="1" stop-color="#3b82ff"/></linearGradient>
<radialGradient id="gl" cx="0.85" cy="0.15" r="0.7"><stop offset="0" stop-color="#00d1ff" stop-opacity="0.22"/><stop offset="1" stop-color="#00d1ff" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
</defs><rect width="1280" height="350" rx="18" fill="url(#bg)"/>
<text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#00d1ff" letter-spacing="3">HOW IT WORKS</text>
<rect x="40" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#00d1ff" stroke-opacity="0.6"/><rect x="40" y="78" width="250" height="128" rx="16" fill="#00d1ff" fill-opacity="0.07"/><text x="60" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >1. Your test corpus</text><text x="60" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Sample logs in a JSON suite</text><text x="60" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >with the rule, level and</text><text x="60" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >decoder you expect</text><rect x="352" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#00d1ff" stroke-opacity="0.6"/><rect x="352" y="78" width="250" height="128" rx="16" fill="#00d1ff" fill-opacity="0.07"/><text x="372" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >2. Wazuh 4.x logtest</text><text x="372" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Your disposable test manager</text><text x="372" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >over HTTPS, or an offline</text><text x="372" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >replay of saved results</text><rect x="664" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#00d1ff" stroke-opacity="0.6"/><rect x="664" y="78" width="250" height="128" rx="16" fill="#00d1ff" fill-opacity="0.07"/><text x="684" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >3. Checks</text><text x="684" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Expected and forbidden rules,</text><text x="684" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >sequences, no-alert cases.</text><text x="684" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >Backend warnings fail too</text><rect x="976" y="78" width="250" height="128" rx="16" fill="#0d1730" stroke="#3b82ff" stroke-opacity="0.6"/><rect x="976" y="78" width="250" height="128" rx="16" fill="#3b82ff" fill-opacity="0.07"/><text x="996" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" >4. Reports</text><text x="996" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >JSON, JUnit XML and an</text><text x="996" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >offline HTML page. Exit code</text><text x="996" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#aab9df" >1 when something fails</text><path d="M298 142 H336" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round"/><path d="M330 135 L341 142 L330 149" fill="none" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 142 H648" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round"/><path d="M642 135 L653 142 L642 149" fill="none" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M922 142 H960" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round"/><path d="M954 135 L965 142 L954 149" fill="none" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="252" width="1200" height="70" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#2a3c6b"/><text x="66" y="283" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" >Upgrade or rule edit?</text><text x="66" y="305" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#aab9df" >Save baseline.json first, run again on the candidate, then compare the two.</text><rect x="842" y="268" width="170" height="38" rx="10" fill="#ffffff" fill-opacity="0.07"/><text x="927" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#dbe6ff" text-anchor="middle">baseline.json</text><path d="M1018 287 H1052" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round"/><path d="M1046 280 L1057 287 L1046 294" fill="none" stroke="#00d1ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1064" y="268" width="160" height="38" rx="10" fill="#ff4d6d" fill-opacity="0.16"/><text x="1144" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffb3c1" text-anchor="middle">changes.html</text>
</svg>